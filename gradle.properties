# memory caps: keep the build well under the machine's ram budget.
# gradle daemon heap (kotlin compiles in-process, so this covers the compiler too)
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon.idletimeout=600000
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx768m
ksp.useKSP2=true
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true
android.builtInKotlin=true
android.newDsl=true
